name: Documenter checks

on:
  push:
  pull_request:

jobs:
  node:
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-eng tesseract-ocr-osd poppler-utils python3-pil
      - run: npm ci
      - run: |
          python3 - <<'PY'
          from PIL import Image, ImageDraw, ImageFont
          image = Image.new("RGB", (1800, 500), "white")
          draw = ImageDraw.Draw(image)
          font = ImageFont.truetype("/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf", 72)
          draw.text((80, 80), "Documenter OCR Test 42", fill="black", font=font)
          draw.text((80, 190), "Heading: Offline Evidence", fill="black", font=font)
          image.save("/tmp/documenter-ocr.png")
          image.save("/tmp/documenter-ocr-scan.pdf", "PDF", resolution=300)
          PY
      - run: npm test
      - run: npm run check
      - run: node scripts/generate-guide.mjs --root . --output "$RUNNER_TEMP/DOCUMENTATION-GUIDE.md"

  integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: node scripts/verify-examples.mjs --input .github/fixtures/documenter-examples.json --output "$RUNNER_TEMP/documenter-examples.json"
      - run: node scripts/renderer-check.mjs --root .
      - run: node scripts/omp-host-matrix.mjs --output "$RUNNER_TEMP/omp-host-matrix.json"
      - run: npm test
      - run: npm run check
      - uses: actions/upload-artifact@v4
        with:
          name: documenter-integrity-evidence
          path: |
            ${{ runner.temp }}/documenter-examples.json
            ${{ runner.temp }}/omp-host-matrix.json
